<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Three crop room decisions"><rect width="1200" height="675" fill="#0b1730"/><text x="100" y="105" fill="#dce8fa" font-family="Arial" font-size="36" font-weight="700">WHEN THE FINAL BOX TOUCHES AN EDGE</text><path d="M600 155v92" stroke="#86aefb" stroke-width="8"/><path d="M600 247l-15-20m15 20 15-20" stroke="#86aefb" stroke-width="8" fill="none"/><g font-family="Arial"><rect x="90" y="300" width="300" height="205" rx="24" fill="#173454" stroke="#64f2d2" stroke-width="3"/><text x="155" y="370" fill="#64f2d2" font-size="32" font-weight="700">REDUCE</text><text x="130" y="420" fill="#dce8fa" font-size="23">Make the push-in smaller.</text><rect x="450" y="300" width="300" height="205" rx="24" fill="#173454" stroke="#86aefb" stroke-width="3"/><text x="510" y="370" fill="#86aefb" font-size="32" font-weight="700">REDIRECT</text><text x="487" y="420" fill="#dce8fa" font-size="23">Choose a safer direction.</text><rect x="810" y="300" width="300" height="205" rx="24" fill="#173454" stroke="#f5c276" stroke-width="3"/><text x="865" y="370" fill="#f5c276" font-size="32" font-weight="700">REPLACE</text><text x="840" y="420" fill="#dce8fa" font-size="23">Use a roomier source.</text></g><text x="278" y="600" fill="#b7c4dc" font-family="Arial" font-size="27">Change the source-level decision before adding prompt complexity.</text></svg>
