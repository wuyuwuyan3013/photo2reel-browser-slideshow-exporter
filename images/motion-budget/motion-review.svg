<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three-frame review of an image-to-video motion test</title><desc id="desc">Three numbered frames show a source frame, an intended movement, and a final review of protected details.</desc><rect width="1200" height="675" rx="34" fill="#0b1830"/><text x="72" y="90" fill="#64f2d2" font-family="Arial,sans-serif" font-size="25" font-weight="700">THREE-FRAME ACCEPTANCE TEST</text><g font-family="Arial,sans-serif"><g transform="translate(72 145)"><rect width="322" height="365" rx="22" fill="#18314d" stroke="#375f86" stroke-width="3"/><rect x="30" y="50" width="262" height="201" rx="12" fill="#7aa5be"/><path d="M30 208c60-42 120-60 262 8v35H30Z" fill="#3c625e"/><circle cx="161" cy="139" r="47" fill="#f6d0b8"/><path d="M99 239c20-91 117-88 129 0Z" fill="#536e9d"/><circle cx="31" cy="-12" r="27" fill="#64f2d2"/><text x="22" y="-3" fill="#092019" font-size="23" font-weight="800">1</text><text x="30" y="298" fill="#eef5ff" font-size="26" font-weight="700">Source</text><text x="30" y="333" fill="#c9d5e9" font-size="21">Name the fixed details.</text></g><g transform="translate(439 145)"><rect width="322" height="365" rx="22" fill="#18314d" stroke="#375f86" stroke-width="3"/><rect x="30" y="50" width="262" height="201" rx="12" fill="#7aa5be"/><path d="M30 208c60-42 120-60 262 8v35H30Z" fill="#3c625e"/><circle cx="161" cy="139" r="47" fill="#f6d0b8"/><path d="M99 239c20-91 117-88 129 0Z" fill="#536e9d"/><path d="M236 94c29 28 29 78 0 106" fill="none" stroke="#64f2d2" stroke-width="9" stroke-linecap="round"/><path d="M248 193l-18 11 2-21Z" fill="#64f2d2"/><circle cx="31" cy="-12" r="27" fill="#64f2d2"/><text x="22" y="-3" fill="#092019" font-size="23" font-weight="800">2</text><text x="30" y="298" fill="#eef5ff" font-size="26" font-weight="700">Change</text><text x="30" y="333" fill="#c9d5e9" font-size="21">Ask for one visible action.</text></g><g transform="translate(806 145)"><rect width="322" height="365" rx="22" fill="#18314d" stroke="#375f86" stroke-width="3"/><rect x="30" y="50" width="262" height="201" rx="12" fill="#7aa5be"/><path d="M30 208c60-42 120-60 262 8v35H30Z" fill="#3c625e"/><circle cx="161" cy="139" r="47" fill="#f6d0b8"/><path d="M99 239c20-91 117-88 129 0Z" fill="#536e9d"/><path d="M75 87h174v126H75Z" fill="none" stroke="#64f2d2" stroke-width="6"/><path d="m262 80 12 13 23-30" fill="none" stroke="#64f2d2" stroke-width="8" stroke-linecap="round"/><circle cx="31" cy="-12" r="27" fill="#64f2d2"/><text x="22" y="-3" fill="#092019" font-size="23" font-weight="800">3</text><text x="30" y="298" fill="#eef5ff" font-size="26" font-weight="700">Review</text><text x="30" y="333" fill="#c9d5e9" font-size="21">Check the same fixed details.</text></g></g><text x="72" y="594" fill="#b7c6de" font-family="Arial,sans-serif" font-size="24">A render is accepted only when the requested motion appears and the protected details remain unchanged.</text></svg>
