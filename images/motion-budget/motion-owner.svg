<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Motion budget card with one moving subject</title><desc id="desc">A simple source frame separates a moving leaf from a locked bottle and a locked camera.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102244"/><stop offset="1" stop-color="#071426"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><rect x="76" y="79" width="660" height="494" rx="22" fill="#162b50" stroke="#8ad9ff" stroke-width="3"/><circle cx="407" cy="328" r="138" fill="#405b76"/><rect x="350" y="254" width="114" height="210" rx="28" fill="#e7eef7"/><rect x="366" y="283" width="82" height="113" rx="10" fill="#64f2d2" opacity=".8"/><path d="M576 198c43 28 41 89-2 119-38-29-36-86 2-119Z" fill="#f4be5f"/><path d="M570 322c47 27 45 91-2 119-39-31-36-89 2-119Z" fill="#f4be5f"/><path d="M573 482c40 21 39 75-2 100-35-25-32-75 2-100Z" fill="#f4be5f"/><path d="M760 183h350" stroke="#64f2d2" stroke-width="3"/><text x="774" y="230" fill="#64f2d2" font-family="Arial,sans-serif" font-size="24" font-weight="700">MOTION BUDGET</text><text x="774" y="288" fill="#eef5ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">One performer</text><text x="774" y="333" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">Leaves drift slowly.</text><text x="774" y="397" fill="#eef5ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Protected</text><text x="774" y="438" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">Bottle · label · camera</text><text x="774" y="502" fill="#eef5ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Review point</text><text x="774" y="543" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">The label never drifts.</text></svg>
