<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Motion boundary with allowed and protected areas</title><desc id="desc">A source frame marks one allowed movement zone and protected image details.</desc><rect width="1200" height="675" rx="34" fill="#091426"/><rect x="68" y="70" width="1064" height="535" rx="28" fill="#132541" stroke="#385d87" stroke-width="3"/><rect x="126" y="128" width="590" height="420" rx="18" fill="#7ba3bd"/><path d="M126 436c130-92 220-136 333-99 87 28 149 28 257-62v273H126Z" fill="#385a63"/><rect x="273" y="181" width="215" height="292" rx="18" fill="none" stroke="#f5d675" stroke-width="8" stroke-dasharray="16 12"/><circle cx="379" cy="287" r="54" fill="#f7d1b8"/><path d="M302 405c28-102 114-136 154-42l25 110H280Z" fill="#33456f"/><path d="M560 281c55 32 56 111 1 147-52-35-50-111-1-147Z" fill="#64f2d2" opacity=".9"/><text x="772" y="176" fill="#64f2d2" font-family="Arial,sans-serif" font-size="23" font-weight="700">BEFORE YOU PROMPT</text><text x="772" y="234" fill="#eef5ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Draw the boundary</text><circle cx="790" cy="302" r="9" fill="#64f2d2"/><text x="818" y="312" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">Allowed: the leaf moves.</text><circle cx="790" cy="365" r="9" fill="#f5d675"/><text x="818" y="375" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">Protected: face and frame.</text><circle cx="790" cy="428" r="9" fill="#e98892"/><text x="818" y="438" fill="#c9d5e9" font-family="Arial,sans-serif" font-size="25">Excluded: camera swing.</text><text x="772" y="520" fill="#eef5ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">If two zones compete,</text><text x="772" y="559" fill="#eef5ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">reduce the motion job.</text></svg>
