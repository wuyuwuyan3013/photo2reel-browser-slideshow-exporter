<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Sort image to video input types</title><desc id="desc">Four illustrated cards compare a still scene, ordered frames, a voice waveform, and a text note.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#10254b"/><stop offset="1" stop-color="#0a172e"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="#071226"/><text x="60" y="78" fill="#eaf4ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Start with the evidence you have</text><text x="60" y="115" fill="#a9bad3" font-family="Arial,sans-serif" font-size="19">Each starting material establishes a different part of the job.</text><g font-family="Arial,sans-serif"><g transform="translate(60 165)"><rect width="250" height="400" rx="22" fill="url(#g)" stroke="#45678f"/><rect x="24" y="28" width="202" height="135" rx="14" fill="#f2c481"/><circle cx="103" cy="83" r="25" fill="#ffecac"/><path d="M34 152 96 95l44 39 27-23 59 41v1H34z" fill="#668db4"/><text x="24" y="211" fill="#69efd0" font-size="18" font-weight="700">ONE STILL SCENE</text><text x="24" y="250" fill="#eaf4ff" font-size="21" font-weight="700">Visible source facts</text><text x="24" y="285" fill="#b8cae3" font-size="18">Subject, framing, light,</text><text x="24" y="313" fill="#b8cae3" font-size="18">and a detail to protect.</text></g><g transform="translate(330 165)"><rect width="250" height="400" rx="22" fill="url(#g)" stroke="#45678f"/><g transform="translate(24 30)"><rect width="58" height="110" rx="9" fill="#8bd6cf"/><rect x="72" width="58" height="110" rx="9" fill="#f0c16e"/><rect x="144" width="58" height="110" rx="9" fill="#a18be5"/></g><path d="M48 168h150" stroke="#69efd0" stroke-width="4"/><path d="m183 158 20 10-20 10" fill="none" stroke="#69efd0" stroke-width="4"/><text x="24" y="211" fill="#69efd0" font-size="18" font-weight="700">ORDERED FRAMES</text><text x="24" y="250" fill="#eaf4ff" font-size="21" font-weight="700">Chosen visible beats</text><text x="24" y="285" fill="#b8cae3" font-size="18">New angles, places, or</text><text x="24" y="313" fill="#b8cae3" font-size="18">states need source frames.</text></g><g transform="translate(600 165)"><rect width="250" height="400" rx="22" fill="url(#g)" stroke="#45678f"/><path d="M27 94h16l12-44 18 88 18-114 20 142 19-78 20 42h20" fill="none" stroke="#ffcf7d" stroke-width="7" stroke-linecap="round"/><text x="24" y="211" fill="#69efd0" font-size="18" font-weight="700">VOICE NOTE</text><text x="24" y="250" fill="#eaf4ff" font-size="21" font-weight="700">Timing or performance</text><text x="24" y="285" fill="#b8cae3" font-size="18">Words can guide a scene,</text><text x="24" y="313" fill="#b8cae3" font-size="18">but do not show the scene.</text></g><g transform="translate(870 165)"><rect width="250" height="400" rx="22" fill="url(#g)" stroke="#45678f"/><rect x="45" y="26" width="160" height="140" rx="12" fill="#eaf4ff"/><path d="M68 65h111M68 91h92M68 117h105" stroke="#56749d" stroke-width="9" stroke-linecap="round"/><text x="24" y="211" fill="#69efd0" font-size="18" font-weight="700">TEXT IDEA</text><text x="24" y="250" fill="#eaf4ff" font-size="21" font-weight="700">Desired action</text><text x="24" y="285" fill="#b8cae3" font-size="18">The idea needs a chosen</text><text x="24" y="313" fill="#b8cae3" font-size="18">picture before review.</text></g></g><text x="60" y="625" fill="#8fa5c5" font-family="Arial,sans-serif" font-size="18">Input type is a planning choice, not a promise about a service's features.</text></svg>
