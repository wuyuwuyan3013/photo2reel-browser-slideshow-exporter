<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Image to video input decision path</title><desc id="desc">A four-step flow identifies source input, protected reference, one allowed change, and frame evidence.</desc><rect width="1200" height="675" rx="28" fill="#071226"/><g font-family="Arial,sans-serif"><text x="60" y="78" fill="#eaf4ff" font-size="34" font-weight="700">Do not extend the prompt yet</text><text x="60" y="115" fill="#a9bad3" font-size="19">First make the input and the final review condition inspectable.</text><g transform="translate(60 180)"><g><rect width="240" height="255" rx="22" fill="#10284a" stroke="#527ba4"/><circle cx="48" cy="49" r="23" fill="#69efd0"/><text x="40" y="56" fill="#072018" font-size="19" font-weight="700">1</text><text x="27" y="108" fill="#eaf4ff" font-size="23" font-weight="700">Name the input</text><text x="27" y="147" fill="#bed0e8" font-size="18">Photo, frames, voice,</text><text x="27" y="174" fill="#bed0e8" font-size="18">clip, or text idea?</text></g><path d="M255 128h56" stroke="#69efd0" stroke-width="5"/><path d="m295 112 20 16-20 16" fill="none" stroke="#69efd0" stroke-width="5"/><g transform="translate(300)"><rect width="240" height="255" rx="22" fill="#10284a" stroke="#527ba4"/><circle cx="48" cy="49" r="23" fill="#69efd0"/><text x="40" y="56" fill="#072018" font-size="19" font-weight="700">2</text><text x="27" y="108" fill="#eaf4ff" font-size="23" font-weight="700">Protect one thing</text><text x="27" y="147" fill="#bed0e8" font-size="18">Choose one detail that</text><text x="27" y="174" fill="#bed0e8" font-size="18">must stay comparable.</text></g><path d="M555 128h56" stroke="#69efd0" stroke-width="5"/><path d="m595 112 20 16-20 16" fill="none" stroke="#69efd0" stroke-width="5"/><g transform="translate(600)"><rect width="240" height="255" rx="22" fill="#10284a" stroke="#527ba4"/><circle cx="48" cy="49" r="23" fill="#69efd0"/><text x="40" y="56" fill="#072018" font-size="19" font-weight="700">3</text><text x="27" y="108" fill="#eaf4ff" font-size="23" font-weight="700">Allow one change</text><text x="27" y="147" fill="#bed0e8" font-size="18">Subject, camera, light,</text><text x="27" y="174" fill="#bed0e8" font-size="18">or environment—one only.</text></g><path d="M855 128h56" stroke="#69efd0" stroke-width="5"/><path d="m895 112 20 16-20 16" fill="none" stroke="#69efd0" stroke-width="5"/><g transform="translate(900)"><rect width="240" height="255" rx="22" fill="#173347" stroke="#69efd0"/><circle cx="48" cy="49" r="23" fill="#ffcf7d"/><text x="40" y="56" fill="#332200" font-size="19" font-weight="700">4</text><text x="27" y="108" fill="#eaf4ff" font-size="23" font-weight="700">Name the proof</text><text x="27" y="147" fill="#bed0e8" font-size="18">Which visible frame tells</text><text x="27" y="174" fill="#bed0e8" font-size="18">you the test passed?</text></g></g><rect x="60" y="505" width="1080" height="70" rx="18" fill="#0d203b"/><text x="88" y="548" fill="#cce0f7" font-size="22">If you cannot describe the final proof, prepare another source frame or narrow the motion request.</text></g></svg>
