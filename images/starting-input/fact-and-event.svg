<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Separate source fact from allowed event</title><desc id="desc">An illustration compares a source product photo fact to one allowed motion event and a final frame check.</desc><rect width="1200" height="675" rx="28" fill="#071226"/><g font-family="Arial,sans-serif"><text x="60" y="78" fill="#eaf4ff" font-size="34" font-weight="700">One source fact + one allowed event</text><text x="60" y="115" fill="#a9bad3" font-size="19">Make the visible reference and the requested motion different lines in the brief.</text><g transform="translate(60 180)"><rect width="325" height="350" rx="22" fill="#112a4d" stroke="#5d89b2"/><text x="28" y="48" fill="#69efd0" font-size="18" font-weight="700">SOURCE FACT</text><rect x="27" y="77" width="270" height="172" rx="15" fill="#d6b583"/><rect x="106" y="101" width="104" height="133" rx="14" fill="#3f8dc3"/><rect x="122" y="130" width="73" height="36" rx="5" fill="#f4f0db"/><path d="M30 249h264" stroke="#a77f52" stroke-width="13"/><text x="28" y="288" fill="#eaf4ff" font-size="19">Label faces front. Table edge and</text><text x="28" y="316" fill="#eaf4ff" font-size="19">window reflection are visible.</text></g><g transform="translate(438 180)"><path d="M0 175h264" stroke="#69efd0" stroke-width="6"/><path d="m232 145 42 30-42 30" fill="none" stroke="#69efd0" stroke-width="6"/><text x="34" y="143" fill="#a9bad3" font-family="Arial,sans-serif" font-size="18">write separately</text></g><g transform="translate(755 180)"><rect width="385" height="350" rx="22" fill="#173347" stroke="#69efd0"/><text x="28" y="48" fill="#69efd0" font-size="18" font-weight="700">ALLOWED EVENT</text><path d="M70 189c35-70 96-76 153-29" fill="none" stroke="#ffcf7d" stroke-width="9" stroke-linecap="round"/><path d="m206 137 28 27-37 11" fill="none" stroke="#ffcf7d" stroke-width="9"/><rect x="127" y="125" width="89" height="113" rx="13" fill="#3f8dc3"/><rect x="140" y="149" width="64" height="31" rx="5" fill="#f4f0db"/><text x="28" y="288" fill="#eaf4ff" font-size="19">A hand lifts the product once.</text><text x="28" y="316" fill="#eaf4ff" font-size="19">Camera stays fixed; label remains readable.</text></g><rect x="60" y="575" width="1080" height="48" rx="14" fill="#0d203b"/><text x="84" y="606" fill="#cce0f7" font-family="Arial,sans-serif" font-size="19">Review proof: compare the first, middle, and final visible frames against the same source reference.</text></g></svg>
