<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A hand-object contact contract</title><desc id="desc">A source grip beside one allowed lift with a locked camera.</desc><rect width="1200" height="675" rx="30" fill="#0d203b"/><text x="60" y="74" fill="#69efd0" font-family="Arial,sans-serif" font-size="24" font-weight="700">ONE STARTING GRIP + ONE ALLOWED EVENT</text><g font-family="Arial,sans-serif"><g transform="translate(60 130)"><rect width="430" height="390" rx="24" fill="#173347" stroke="#69efd0" stroke-width="2"/><text x="30" y="52" fill="#69efd0" font-size="19" font-weight="700">SOURCE FACT</text><rect x="162" y="145" width="112" height="161" rx="18" fill="#4b8fc7"/><rect x="178" y="170" width="80" height="43" rx="6" fill="#f1e6c8"/><path d="M0 326h430" stroke="#a87958" stroke-width="18"/><path d="M82 246c34-12 57-7 85 10l51-47c10-9 25 4 15 15l-38 43 36 2c23 2 26 32 1 35l-74 8c-29 3-50-12-75-25" fill="#efc29c" stroke="#f7d8b6" stroke-width="8" stroke-linejoin="round"/><text x="30" y="354" fill="#d4e4f7" font-size="18">Right hand holds the lower half.</text><text x="30" y="380" fill="#d4e4f7" font-size="18">Thumb stays on the near side.</text></g><path d="M522 320h126" stroke="#69efd0" stroke-width="7"/><path d="m624 293 38 27-38 27" fill="none" stroke="#69efd0" stroke-width="7"/><text x="528" y="285" fill="#b9cce5" font-size="17">allow one lift</text><g transform="translate(710 130)"><rect width="430" height="390" rx="24" fill="#173347" stroke="#ffcf7d" stroke-width="2"/><text x="30" y="52" fill="#ffcf7d" font-size="19" font-weight="700">ALLOWED EVENT</text><rect x="162" y="104" width="112" height="161" rx="18" fill="#4b8fc7"/><rect x="178" y="129" width="80" height="43" rx="6" fill="#f1e6c8"/><path d="M0 326h430" stroke="#a87958" stroke-width="18"/><path d="M82 210c34-12 57-7 85 10l51-47c10-9 25 4 15 15l-38 43 36 2c23 2 26 32 1 35l-74 8c-29 3-50-12-75-25" fill="#efc29c" stroke="#f7d8b6" stroke-width="8" stroke-linejoin="round"/><path d="M219 292V91" stroke="#69efd0" stroke-width="7" stroke-dasharray="14 11"/><path d="m196 109 23-33 23 33" fill="none" stroke="#69efd0" stroke-width="7"/><text x="30" y="354" fill="#d4e4f7" font-size="18">Lift once. Camera and contact side</text><text x="30" y="380" fill="#d4e4f7" font-size="18">stay comparable until exit.</text></g></g><text x="60" y="612" fill="#b9cce5" font-family="Arial,sans-serif" font-size="20">A contact contract gives the review a source-relative relationship to compare.</text></svg>
