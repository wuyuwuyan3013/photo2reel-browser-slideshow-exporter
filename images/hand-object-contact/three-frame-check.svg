<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three-frame contact check</title><desc id="desc">A hand holds, lifts, and finishes with the same bottle over three review frames.</desc><rect width="1200" height="675" rx="30" fill="#0d203b"/><text x="60" y="75" fill="#69efd0" font-family="Arial,sans-serif" font-size="24" font-weight="700">START · MIDDLE · END: CHECK THE SAME RELATIONSHIP</text><g font-family="Arial,sans-serif"><g transform="translate(60 130)"><rect width="330" height="365" rx="22" fill="#173347" stroke="#69efd0" stroke-width="2"/><text x="25" y="47" fill="#69efd0" font-size="18" font-weight="700">START</text><rect x="122" y="155" width="87" height="125" rx="15" fill="#4b8fc7"/><rect x="135" y="176" width="61" height="30" rx="5" fill="#f1e6c8"/><path d="M0 300h330" stroke="#a87958" stroke-width="16"/><path d="M42 243c31-16 57-12 79 2l42-39c10-9 24 4 14 15l-29 35 30 4c21 3 22 30-1 32l-65 6c-26 3-46-10-70-23" fill="#efc29c" stroke="#f7d8b6" stroke-width="7"/><text x="25" y="330" fill="#d4e4f7" font-size="17">Named hand + visible side</text></g><g transform="translate(435 130)"><rect width="330" height="365" rx="22" fill="#173347" stroke="#69efd0" stroke-width="2"/><text x="25" y="47" fill="#69efd0" font-size="18" font-weight="700">MIDDLE</text><rect x="122" y="107" width="87" height="125" rx="15" fill="#4b8fc7"/><rect x="135" y="128" width="61" height="30" rx="5" fill="#f1e6c8"/><path d="M0 300h330" stroke="#a87958" stroke-width="16"/><path d="M42 195c31-16 57-12 79 2l42-39c10-9 24 4 14 15l-29 35 30 4c21 3 22 30-1 32l-65 6c-26 3-46-10-70-23" fill="#efc29c" stroke="#f7d8b6" stroke-width="7"/><path d="M165 286V92" stroke="#69efd0" stroke-width="6" stroke-dasharray="12 9"/><text x="25" y="330" fill="#d4e4f7" font-size="17">One event is underway</text></g><g transform="translate(810 130)"><rect width="330" height="365" rx="22" fill="#173347" stroke="#69efd0" stroke-width="2"/><text x="25" y="47" fill="#69efd0" font-size="18" font-weight="700">END</text><rect x="122" y="76" width="87" height="125" rx="15" fill="#4b8fc7"/><rect x="135" y="97" width="61" height="30" rx="5" fill="#f1e6c8"/><path d="M0 300h330" stroke="#a87958" stroke-width="16"/><path d="M42 164c31-16 57-12 79 2l42-39c10-9 24 4 14 15l-29 35 30 4c21 3 22 30-1 32l-65 6c-26 3-46-10-70-23" fill="#efc29c" stroke="#f7d8b6" stroke-width="7"/><text x="25" y="330" fill="#d4e4f7" font-size="17">Readable final stop</text></g></g><path d="M95 572h1008" stroke="#69efd0" stroke-width="5"/><text x="60" y="626" fill="#b9cce5" font-family="Arial,sans-serif" font-size="20">Pass only when the object, contact side, and requested event remain readable across all three frames.</text></svg>
