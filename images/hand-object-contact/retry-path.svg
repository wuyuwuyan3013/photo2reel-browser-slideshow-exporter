<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Contact retry path</title><desc id="desc">A source grip moves through one action into pass, retry, or inconclusive outcomes.</desc><rect width="1200" height="675" rx="30" fill="#0d203b"/><text x="60" y="75" fill="#69efd0" font-family="Arial,sans-serif" font-size="24" font-weight="700">WHEN CONTACT FAILS, SIMPLIFY THE JOB</text><g font-family="Arial,sans-serif"><g transform="translate(60 148)"><rect width="285" height="290" rx="22" fill="#173347" stroke="#69efd0" stroke-width="2"/><text x="25" y="50" fill="#69efd0" font-size="19" font-weight="700">1. SOURCE GRIP</text><text x="25" y="98" fill="#d4e4f7" font-size="18">Name the hand, object,</text><text x="25" y="126" fill="#d4e4f7" font-size="18">contact side, and crop.</text><path d="M39 210c40-34 86-29 131 2" fill="none" stroke="#efc29c" stroke-width="26" stroke-linecap="round"/><rect x="170" y="158" width="58" height="98" rx="12" fill="#4b8fc7"/></g><path d="M370 292h105" stroke="#69efd0" stroke-width="7"/><path d="m450 265 39 27-39 27" fill="none" stroke="#69efd0" stroke-width="7"/><g transform="translate(510 148)"><rect width="285" height="290" rx="22" fill="#173347" stroke="#ffcf7d" stroke-width="2"/><text x="25" y="50" fill="#ffcf7d" font-size="19" font-weight="700">2. ONE EVENT</text><text x="25" y="98" fill="#d4e4f7" font-size="18">Lift OR press OR open.</text><text x="25" y="126" fill="#d4e4f7" font-size="18">Keep the camera fixed.</text><path d="M137 240V168" stroke="#69efd0" stroke-width="7" stroke-dasharray="11 8"/><path d="m115 187 22-31 22 31" fill="none" stroke="#69efd0" stroke-width="7"/></g><path d="M820 292h105" stroke="#69efd0" stroke-width="7"/><path d="m900 265 39 27-39 27" fill="none" stroke="#69efd0" stroke-width="7"/><g transform="translate(950 126)"><rect width="190" height="118" rx="20" fill="#153c34" stroke="#69efd0" stroke-width="2"/><text x="21" y="43" fill="#69efd0" font-size="18" font-weight="700">PASS</text><text x="21" y="76" fill="#d4e4f7" font-size="16">Same contact,</text><text x="21" y="99" fill="#d4e4f7" font-size="16">readable ending.</text></g><g transform="translate(950 277)"><rect width="190" height="118" rx="20" fill="#432e36" stroke="#ff9292" stroke-width="2"/><text x="21" y="43" fill="#ff9292" font-size="18" font-weight="700">RETRY</text><text x="21" y="76" fill="#d4e4f7" font-size="16">Extra limb, drift,</text><text x="21" y="99" fill="#d4e4f7" font-size="16">or flipped side.</text></g><g transform="translate(950 428)"><rect width="190" height="118" rx="20" fill="#3d3840" stroke="#b9cce5" stroke-width="2"/><text x="21" y="43" fill="#d9e7f8" font-size="18" font-weight="700">INCONCLUSIVE</text><text x="21" y="76" fill="#d4e4f7" font-size="16">Important contact</text><text x="21" y="99" fill="#d4e4f7" font-size="16">is hidden.</text></g></g><text x="60" y="615" fill="#b9cce5" font-family="Arial,sans-serif" font-size="20">Do not solve a failed grip by piling on directions: reduce the event or improve the source view first.</text></svg>
