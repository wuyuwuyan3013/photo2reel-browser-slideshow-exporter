<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Allowed motion versus protected facial mark</title>
  <desc id="desc">Two synthetic geometric portrait panels distinguish a camera or pose movement from a face repaint that moves a protected small facial mark.</desc>
  <rect width="1200" height="675" fill="#091529"/>
  <text x="65" y="68" fill="#69f0d2" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="3">ALLOW MOTION · PROTECT THE MARK</text>
  <rect x="64" y="108" width="518" height="500" rx="26" fill="#17394a" stroke="#69f0d2" stroke-width="3"/>
  <rect x="618" y="108" width="518" height="500" rx="26" fill="#392c3a" stroke="#ff8aa6" stroke-width="3"/>
  <text x="105" y="160" fill="#69f0d2" font-family="Arial,sans-serif" font-size="28" font-weight="700">ALLOWED: ONE SMALL MOTION</text>
  <text x="660" y="160" fill="#ff9bb0" font-family="Arial,sans-serif" font-size="28" font-weight="700">AVOID: MARK REPAINT</text>
  <g transform="translate(119 197)">
    <rect width="172" height="258" rx="20" fill="#304d62"/><circle cx="86" cy="126" r="73" fill="#efbca2"/><path d="M23 112q11-89 72-91v58q-45 9-58 58z" fill="#443043"/>
    <ellipse cx="65" cy="125" rx="9" ry="7" fill="#253247"/><ellipse cx="109" cy="125" rx="9" ry="7" fill="#253247"/><path d="M86 142v22" stroke="#b35f59" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="159" r="9" fill="#ff7d9d" stroke="#ffe1e8" stroke-width="3"/>
  </g>
  <g transform="translate(339 197)">
    <rect width="172" height="258" rx="20" fill="#304d62"/><circle cx="91" cy="126" r="73" fill="#efbca2"/><path d="M28 112q11-89 72-91v58q-45 9-58 58z" fill="#443043"/>
    <ellipse cx="70" cy="125" rx="9" ry="7" fill="#253247"/><ellipse cx="114" cy="125" rx="9" ry="7" fill="#253247"/><path d="M91 142v22" stroke="#b35f59" stroke-width="6" stroke-linecap="round"/><circle cx="125" cy="159" r="9" fill="#ff7d9d" stroke="#ffe1e8" stroke-width="3"/>
  </g>
  <path d="M292 325h40m-15-15 15 15-15 15" fill="none" stroke="#69f0d2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 504h348" stroke="#69f0d2" stroke-width="6" stroke-linecap="round"/>
  <text x="141" y="544" fill="#eaf5ff" font-family="Arial,sans-serif" font-size="21">Blink or shift gaze.</text>
  <text x="141" y="574" fill="#eaf5ff" font-family="Arial,sans-serif" font-size="21">Keep camera and head pose fixed.</text>
  <g transform="translate(678 197)">
    <rect width="172" height="258" rx="20" fill="#573d4b"/><circle cx="86" cy="126" r="73" fill="#efbca2"/><path d="M23 112q11-89 72-91v58q-45 9-58 58z" fill="#443043"/>
    <ellipse cx="65" cy="125" rx="9" ry="7" fill="#253247"/><ellipse cx="109" cy="125" rx="9" ry="7" fill="#253247"/><path d="M86 142v22" stroke="#b35f59" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="159" r="9" fill="#ff7d9d" stroke="#ffe1e8" stroke-width="3"/>
  </g>
  <g transform="translate(898 197)">
    <rect width="172" height="258" rx="20" fill="#573d4b"/><circle cx="91" cy="126" r="73" fill="#efbca2"/><path d="M28 112q11-89 72-91v58q-45 9-58 58z" fill="#443043"/>
    <ellipse cx="70" cy="125" rx="9" ry="7" fill="#253247"/><ellipse cx="114" cy="125" rx="9" ry="7" fill="#253247"/><path d="M91 142v22" stroke="#b35f59" stroke-width="6" stroke-linecap="round"/><circle cx="96" cy="201" r="9" fill="#ff7d9d" stroke="#ffe1e8" stroke-width="3"/>
  </g>
  <path d="M850 325h40m-15-15 15 15-15 15" fill="none" stroke="#ff8aa6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M700 504h348" stroke="#ff8aa6" stroke-width="6" stroke-linecap="round"/><text x="700" y="550" fill="#eaf5ff" font-family="Arial,sans-serif" font-size="23">The mark changes position: reject this result.</text>
