<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">One light event versus a full relight</title><desc id="desc">A bounded cloud softens a small patch of window light, while a separate full-scene sunset changes the time cue.</desc>
  <rect width="1200" height="675" fill="#0b172d"/><text x="66" y="66" fill="#64f2d2" font-family="Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="3">DEFINE THE BOUNDARY</text>
  <rect x="65" y="110" width="520" height="500" rx="27" fill="#173548" stroke="#64f2d2" stroke-width="3"/><rect x="615" y="110" width="520" height="500" rx="27" fill="#382c37" stroke="#ffcf7d" stroke-width="3"/>
  <text x="100" y="166" fill="#64f2d2" font-family="Arial,sans-serif" font-size="36" font-weight="700">ONE ALLOWED EVENT</text><text x="650" y="166" fill="#ffcf7d" font-family="Arial,sans-serif" font-size="36" font-weight="700">A DIFFERENT SCENE</text>
  <rect x="105" y="205" width="440" height="255" rx="16" fill="#86bcd9"/><rect x="655" y="205" width="440" height="255" rx="16" fill="#b8715d"/>
