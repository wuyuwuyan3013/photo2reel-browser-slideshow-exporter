  <circle cx="272" cy="265" r="55" fill="#eef7f1" opacity=".62"/><path d="M225 265c28-25 90-26 123 0" fill="none" stroke="#f5fcfa" stroke-width="28" stroke-linecap="round" opacity=".9"/>
  <path d="M366 312 435 386" stroke="#f8e8c1" stroke-width="40" opacity=".55"/><rect x="350" y="379" width="122" height="15" rx="7" fill="#f9f2dc"/>
  <circle cx="908" cy="327" r="73" fill="#ffb366"/><path d="M763 323 941 395" stroke="#ffcf7d" stroke-width="82" opacity=".4"/><rect x="865" y="380" width="122" height="15" rx="7" fill="#ffdfad"/>
  <path d="M195 508h258" stroke="#64f2d2" stroke-width="7" stroke-linecap="round"/><circle cx="324" cy="508" r="15" fill="#64f2d2"/><path d="M745 508h258" stroke="#ffcf7d" stroke-width="7" stroke-linecap="round"/><path d="M875 491v34M858 508h34" stroke="#ffcf7d" stroke-width="6"/>
  <text x="102" y="565" fill="#eef5ff" font-family="Arial,sans-serif" font-size="30">Local softness; daylight remains.</text><text x="649" y="565" fill="#eef5ff" font-family="Arial,sans-serif" font-size="30">Global warmth; time cue changes.</text>
