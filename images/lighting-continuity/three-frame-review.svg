  <g stroke="#6681a1" stroke-width="3"><rect x="66" y="160" width="300" height="310" rx="18" fill="#496a78"/><rect x="450" y="160" width="300" height="310" rx="18" fill="#42616f"/><rect x="834" y="160" width="300" height="310" rx="18" fill="#496a78"/></g>
  <g fill="#c8e8ff" stroke="#e1f5ff" stroke-width="6"><rect x="90" y="184" width="82" height="158" rx="5"/><rect x="474" y="184" width="82" height="158" rx="5" opacity=".72"/><rect x="858" y="184" width="82" height="158" rx="5"/></g>
  <path d="M66 370h300v100H66zM450 370h300v100H450zM834 370h300v100H834z" fill="#a6b8be"/>
  <g fill="#f4f1e5"><circle cx="238" cy="349" r="36"/><circle cx="622" cy="349" r="36" opacity=".86"/><circle cx="1006" cy="349" r="36"/></g>
