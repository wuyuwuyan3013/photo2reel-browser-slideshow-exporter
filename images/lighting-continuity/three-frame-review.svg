<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">First, middle, final lighting review</title><desc id="desc">Three stylized frames show a small temporary dimming and the same daylight source and shadow direction at the end.</desc>
