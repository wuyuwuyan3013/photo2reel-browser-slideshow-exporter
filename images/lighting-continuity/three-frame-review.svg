  <path d="M377 315h60m-18-17 18 17-18 17M761 315h60m-18-17 18 17-18 17" stroke="#64f2d2" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial,sans-serif" font-size="28" fill="#dce8fa" text-anchor="middle"><text x="216" y="520">Baseline recorded</text><text x="600" y="520">One event passes</text><text x="984" y="520">Cues still agree</text></g>
